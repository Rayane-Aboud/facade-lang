[package]
name = "facadelang"
description = "The FacadeLang checker compiled to WebAssembly, for the browser playground"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib: the .wasm file the browser loads.
# rlib: a normal Rust library, so `cargo test` can test it natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
diagnostics.workspace = true
semantics.workspace = true
syntax.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
